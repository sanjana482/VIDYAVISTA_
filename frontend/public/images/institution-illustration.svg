<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" fill="none">
  <defs>
    <!-- Gradients -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EBF5FB" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#D4EAF7" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="roofGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0A5C91"/>
      <stop offset="100%" stop-color="#0795DC"/>
    </linearGradient>
    <linearGradient id="towerRoof" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EC0E58"/>
      <stop offset="100%" stop-color="#C70644"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EC0E58"/>
      <stop offset="100%" stop-color="#FF6B8B"/>
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="150%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0B2A47" flood-opacity="0.12"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Soft Aura -->
  <circle cx="300" cy="210" r="185" fill="url(#skyGrad)"/>
  <circle cx="450" cy="115" r="50" fill="url(#sunGrad)" opacity="0.35" filter="url(#glow)"/>
  <circle cx="140" cy="155" r="65" fill="#FCE7F3" opacity="0.4" filter="url(#glow)"/>

  <!-- Academic Floating Doodles -->
  <path d="M80 120 L95 105 M95 120 L80 105" stroke="#0795DC" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
  <circle cx="515" cy="90" r="6" stroke="#EC0E58" stroke-width="2" fill="none" opacity="0.7"/>
  <path d="M510 90 H520 M515 85 V95" stroke="#EC0E58" stroke-width="2" stroke-linecap="round"/>

  <!-- Floating Graduation Cap (Top Left) -->
  <g transform="translate(85, 80) rotate(-10)">
    <polygon points="35,12 65,26 35,40 5,26" fill="#0B2A47" />
    <polygon points="18,32 18,44 35,51 52,44 52,32 35,40" fill="#0A5C91" />
    <path d="M60,28 C60,28 65,40 58,48" stroke="#F59E0B" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <circle cx="58" cy="48" r="3" fill="#F59E0B"/>
  </g>

  <!-- Floating Book Stack (Top Right) -->
  <g transform="translate(465, 135) rotate(12)">
    <rect x="0" y="20" width="48" height="10" rx="2.5" fill="#EC0E58"/>
    <rect x="4" y="10" width="45" height="10" rx="2.5" fill="#0795DC"/>
    <rect x="8" y="0" width="42" height="10" rx="2.5" fill="#0B2A47"/>
  </g>

  <!-- Ground Lawn and Pathway -->
  <ellipse cx="300" cy="345" rx="255" ry="32" fill="#D1E7DD" opacity="0.75"/>
  <ellipse cx="300" cy="347" rx="215" ry="20" fill="#A3E635" opacity="0.3"/>
  <path d="M265 365 L278 290 L322 290 L335 365 Z" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>

  <!-- School Campus Main Building Shadow -->
  <rect x="115" y="195" width="370" height="98" rx="4" fill="#0B2A47" opacity="0.05"/>

  <!-- Left Modern Wing -->
  <g>
    <rect x="125" y="195" width="125" height="95" rx="4" fill="#FFFFFF" stroke="#0B2A47" stroke-width="2.5"/>
    <polygon points="187,175 120,195 255,195" fill="url(#roofGrad)" stroke="#0B2A47" stroke-width="2" stroke-linejoin="round"/>
    <!-- Glass Windows Left Wing -->
    <rect x="140" y="208" width="24" height="22" rx="3" fill="#E0F2FE" stroke="#0B2A47" stroke-width="1.5"/>
    <rect x="175" y="208" width="24" height="22" rx="3" fill="#E0F2FE" stroke="#0B2A47" stroke-width="1.5"/>
    <rect x="210" y="208" width="24" height="22" rx="3" fill="#E0F2FE" stroke="#0B2A47" stroke-width="1.5"/>
    <rect x="140" y="242" width="24" height="24" rx="3" fill="#E0F2FE" stroke="#0B2A47" stroke-width="1.5"/>
    <rect x="175" y="242" width="24" height="24" rx="3" fill="#E0F2FE" stroke="#0B2A47" stroke-width="1.5"/>
    <rect x="210" y="242" width="24" height="24" rx="3" fill="#E0F2FE" stroke="#0B2A47" stroke-width="1.5"/>
  </g>

  <!-- Right Modern Wing -->
  <g>
    <rect x="350" y="195" width="125" height="95" rx="4" fill="#FFFFFF" stroke="#0B2A47" stroke-width="2.5"/>
    <polygon points="412,175 345,195 480,195" fill="url(#roofGrad)" stroke="#0B2A47" stroke-width="2" stroke-linejoin="round"/>
    <!-- Glass Windows Right Wing -->
    <rect x="365" y="208" width="24" height="22" rx="3" fill="#E0F2FE" stroke="#0B2A47" stroke-width="1.5"/>
    <rect x="400" y="208" width="24" height="22" rx="3" fill="#E0F2FE" stroke="#0B2A47" stroke-width="1.5"/>
    <rect x="435" y="208" width="24" height="22" rx="3" fill="#E0F2FE" stroke="#0B2A47" stroke-width="1.5"/>
    <rect x="365" y="242" width="24" height="24" rx="3" fill="#E0F2FE" stroke="#0B2A47" stroke-width="1.5"/>
    <rect x="400" y="242" width="24" height="24" rx="3" fill="#E0F2FE" stroke="#0B2A47" stroke-width="1.5"/>
    <rect x="435" y="242" width="24" height="24" rx="3" fill="#E0F2FE" stroke="#0B2A47" stroke-width="1.5"/>
  </g>

  <!-- Central Clock and Portico Building -->
  <g>
    <rect x="240" y="155" width="120" height="135" rx="4" fill="#FFFFFF" stroke="#0B2A47" stroke-width="3"/>
    <!-- Grand Pediment / Triangular Roof -->
    <polygon points="300,115 235,155 365,155" fill="url(#towerRoof)" stroke="#0B2A47" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- Central Flagpole and Flag -->
    <line x1="300" y1="115" x2="300" y2="85" stroke="#0B2A47" stroke-width="2.5"/>
    <polygon points="300,85 326,93 300,101" fill="#0795DC" stroke="#0B2A47" stroke-width="1.5" stroke-linejoin="round"/>

    <!-- Campus Clock -->
    <circle cx="300" cy="175" r="15" fill="#F8FAFC" stroke="#0B2A47" stroke-width="2.5"/>
    <line x1="300" y1="175" x2="300" y2="166" stroke="#0B2A47" stroke-width="2" stroke-linecap="round"/>
    <line x1="300" y1="175" x2="307" y2="175" stroke="#EC0E58" stroke-width="2" stroke-linecap="round"/>

    <!-- Portico Columns -->
    <rect x="255" y="210" width="10" height="80" fill="#F1F5F9" stroke="#0B2A47" stroke-width="2"/>
    <rect x="275" y="210" width="10" height="80" fill="#F1F5F9" stroke="#0B2A47" stroke-width="2"/>
    <rect x="315" y="210" width="10" height="80" fill="#F1F5F9" stroke="#0B2A47" stroke-width="2"/>
    <rect x="335" y="210" width="10" height="80" fill="#F1F5F9" stroke="#0B2A47" stroke-width="2"/>

    <!-- Main Grand Entrance Double Door -->
    <path d="M288 290 V245 A12 12 0 0 1 312 245 V290 Z" fill="#0B2A47"/>
    <line x1="300" y1="245" x2="300" y2="290" stroke="#FFFFFF" stroke-width="1.5"/>
  </g>

  <!-- Campus Trees and Foliage -->
  <g transform="translate(80, 245)">
    <rect x="18" y="45" width="12" height="40" fill="#8D5B4C" rx="2"/>
    <circle cx="24" cy="40" r="32" fill="#34D399" stroke="#0B2A47" stroke-width="2"/>
    <circle cx="32" cy="30" r="22" fill="#10B981"/>
  </g>
  <g transform="translate(470, 240)">
    <rect x="18" y="50" width="12" height="40" fill="#8D5B4C" rx="2"/>
    <circle cx="24" cy="42" r="34" fill="#10B981" stroke="#0B2A47" stroke-width="2"/>
    <circle cx="16" cy="32" r="22" fill="#34D399"/>
  </g>

  <!-- Modern Floating UI Badges (Dribbble SaaS Style) -->
  <!-- Badge 1: Top Left 'Verified Institution 5.0' -->
  <g transform="translate(35, 155)" filter="url(#cardShadow)">
    <rect width="144" height="40" rx="20" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <circle cx="22" cy="20" r="12" fill="#ECFDF5"/>
    <path d="M17 20 L21 24 L28 16" stroke="#10B981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="40" y="19" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="800" fill="#0B2A47">Verified School</text>
    <text x="40" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="700" fill="#F59E0B">★ 4.9 Rating</text>
  </g>

  <!-- Badge 2: Top Right 'Admissions Open' -->
  <g transform="translate(415, 75)" filter="url(#cardShadow)">
    <rect width="150" height="40" rx="20" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <circle cx="22" cy="20" r="12" fill="#FEF2F2"/>
    <circle cx="22" cy="20" r="5" fill="#EC0E58"/>
    <text x="40" y="19" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="800" fill="#0B2A47">Admissions 2025</text>
    <text x="40" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="700" fill="#059669">● Receiving Leads</text>
  </g>

  <!-- Badge 3: Bottom Center '10,000+ Enquiries' -->
  <g transform="translate(205, 335)" filter="url(#cardShadow)">
    <rect width="190" height="38" rx="19" fill="#0B2A47"/>
    <circle cx="21" cy="19" r="11" fill="#EC0E58"/>
    <path d="M17 19 H25 M21 15 V23" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
    <text x="40" y="19" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="800" fill="#FFFFFF">10,000+ Enquiries</text>
    <text x="40" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="500" fill="#94A3B8">Managed on VidyaVista</text>
  </g>
</svg>